<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netlify 測試頁面</title>
  <style>
    body {
      font-family: system-ui, "Microsoft JhengHei", sans-serif;
      margin: 0;
      color: #222;
      line-height: 1.6;
    }
    header {
      background: #2b6cb0;
      color: #fff;
      text-align: center;
      padding: 60px 20px;
    }
    header h1 { margin: 0 0 10px; }
    section {
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .cards { display: flex; gap: 16px; flex-wrap: wrap; }
    .card {
      flex: 1 1 180px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
    }
    button {
      background: #2b6cb0;
      color: #fff;
      border: 0;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #888;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <header>
    <h1>Hello, Netlify!</h1>
    <p>這是一個簡易的一頁式 DEMO 測試頁面</p>
  </header>

  <section>
    <h2>關於</h2>
    <p>此頁面僅用於測試部署流程,沒有任何圖片與外部資源。</p>
  </section>

  <section>
    <h2>特色</h2>
    <div class="cards">
      <div class="card"><h3>簡單</h3><p>單一 HTML 檔案。</p></div>
      <div class="card"><h3>快速</h3><p>無需建置步驟。</p></div>
      <div class="card"><h3>響應式</h3><p>支援手機與桌機。</p></div>
    </div>
  </section>

  <section>
    <h2>互動測試</h2>
    <button id="btn">點我</button>
    <p id="msg">按鈕尚未被點擊。</p>
  </section>

  <footer>&copy; 2026 Demo Page</footer>

  <script>
    let n = 0;
    document.getElementById('btn').addEventListener('click', () => {
      n++;
      document.getElementById('msg').textContent = '已點擊 ' + n + ' 次。';
    });
  </script>
</body>
</html>
